name: Rotate Quote

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours, change this freely
  workflow_dispatch:

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick and inject quote
        run: |
          QUOTES=(
            "The compass was invented before the clock, because direction is more important than time. — Unknown"
            "The ones against you, Believe in you the most. — Unknown"
            "The first to apologize, Is the bravest. — Unknown"
            "The first to forgive, is the strongest. — Unknown"
            "The first to forget, is the happiest. — Unknown"
            "Forgive others, not because they deserve forgiveness, but because you deserve peace. — Unknown"
            "If no one believes in you, be the first. — Unknown"
            "The insult only works, if you accept it. — Diogenes"
            "You won't find the same person twice, not even in the same person. — Unknown"
            "Be a good person, but don't waste all your energy trying to prove it. — Jared Leonard"
            "Your brain is powerful enough to create fear. Imagine what it can do when it creates hope. — Jared Leonard"
            "To fall asleep, you must first pretend to be asleep. And that's how everything else works. — Unknown"
            "You can't expect to get diamonds, if you don't even mine. — Unknown"
            "Too much attention makes a monkey think he's a lion. — Unknown"
            "Don't be a loser in your own fantasy. — Unknown"
            "The villain will always be a villain, if the hero tells the story. — Unknown"
            "You get what you fight for, not what you wish for. — Jared Leonard"
            "A cat that dreams of becoming a lion, must lose its appetite for rats. — Unknown"
            "Don't let your loneliness make you reconnect with toxic people. You shouldn't drink poison just because you're thirsty. — Jared Leonard"
            "Butterflies can't see their own wings, but others admire their beauty. — Jared Leonard"
            "If you're going through hell, keep going. — Jared Leonard"
            "Don't trust anyone, remember the devil was once an Angel. — Unknown"
            "It's not about the house you buy, it's about the home you make. — Jared Leonard"
            "Who you are, is more important than who you've been. — Jared Leonard"
            "Mistakes are proof that you're trying. — Jared Leonard"
            "don't create future if you didn't finish the past. — MG"
          )

          RANDOM_QUOTE="${QUOTES[$RANDOM % ${#QUOTES[@]}]}"

          BLOCK="<!-- QUOTE_START -->\n<p align=\"center\"><i>\"${RANDOM_QUOTE}\"</i></p>\n<!-- QUOTE_END -->"

          perl -i -0pe "s|<!-- QUOTE_START -->.*?<!-- QUOTE_END -->|${BLOCK}|s" README.md

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: rotate quote"
          git push
